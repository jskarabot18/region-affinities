<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Region Affinities has moved</title>
<meta name="robots" content="noindex">
<script>
(function () {
  var repo = "region-affinities";
  var home = "https://thevinotheca.com/library/inquiries/region-affinities/";
  var prefix = "/" + repo + "/";
  var p = location.pathname;
  var tail = "";
  if (p.indexOf(prefix) === 0) { tail = p.slice(prefix.length); }
  var target = home + tail + location.search + location.hash;
  document.addEventListener("DOMContentLoaded", function () {
    var a = document.getElementById("target");
    a.href = target;
    a.textContent = target;
  });
  location.replace(target);
})();
</script>
<style>body{font-family:Georgia,serif;max-width:36em;margin:4em auto;padding:0 1em;line-height:1.5}</style>
</head>
<body>
<p>Region Affinities is now part of the Library of Vinotheca. This page has moved to
<a id="target" href="https://thevinotheca.com/library/inquiries/region-affinities/">https://thevinotheca.com/library/inquiries/region-affinities/</a>.</p>
</body>
</html>
